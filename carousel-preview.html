<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carousel Slides Preview</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f8f5f2;
            color: #333;
            padding: 2rem;
        }
        h1 {
            text-align: center;
            margin-bottom: 2rem;
            font-size: 1.8rem;
            color: #2c2c2c;
        }
        .carousel-group {
            margin-bottom: 3rem;
            background: #fff;
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .carousel-group h2 {
            font-size: 1.2rem;
            margin-bottom: 1rem;
            color: #555;
            border-bottom: 1px solid #eee;
            padding-bottom: 0.5rem;
        }
        .slides {
            display: flex;
            gap: 1rem;
            overflow-x: auto;
            padding-bottom: 0.5rem;
        }
        .slides img {
            height: 400px;
            width: auto;
            border-radius: 8px;
            flex-shrink: 0;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
        }
        .slide-label {
            text-align: center;
            font-size: 0.75rem;
            color: #888;
            margin-top: 0.25rem;
        }
        .slide-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    <h1>Carousel Slides Preview</h1>

    <div class="carousel-group">
        <h2>01 &mdash; Script &amp; Caption Generator</h2>
        <div class="slides">
            <div class="slide-wrapper"><img src="carousels/01-script-caption/slide-01.png" alt="Slide 1"><div class="slide-label">Slide 1</div></div>
            <div class="slide-wrapper"><img src="carousels/01-script-caption/slide-02.png" alt="Slide 2"><div class="slide-label">Slide 2</div></div>
            <div class="slide-wrapper"><img src="carousels/01-script-caption/slide-03.png" alt="Slide 3"><div class="slide-label">Slide 3</div></div>
            <div class="slide-wrapper"><img src="carousels/01-script-caption/slide-04.png" alt="Slide 4"><div class="slide-label">Slide 4</div></div>
            <div class="slide-wrapper"><img src="carousels/01-script-caption/slide-05.png" alt="Slide 5"><div class="slide-label">Slide 5</div></div>
        </div>
    </div>

    <div class="carousel-group">
        <h2>02 &mdash; Email Assistant</h2>
        <div class="slides">
            <div class="slide-wrapper"><img src="carousels/02-email-assistant/slide-01.png" alt="Slide 1"><div class="slide-label">Slide 1</div></div>
            <div class="slide-wrapper"><img src="carousels/02-email-assistant/slide-02.png" alt="Slide 2"><div class="slide-label">Slide 2</div></div>
            <div class="slide-wrapper"><img src="carousels/02-email-assistant/slide-03.png" alt="Slide 3"><div class="slide-label">Slide 3</div></div>
            <div class="slide-wrapper"><img src="carousels/02-email-assistant/slide-04.png" alt="Slide 4"><div class="slide-label">Slide 4</div></div>
            <div class="slide-wrapper"><img src="carousels/02-email-assistant/slide-05.png" alt="Slide 5"><div class="slide-label">Slide 5</div></div>
        </div>
    </div>

    <div class="carousel-group">
        <h2>03 &mdash; Live Prep</h2>
        <div class="slides">
            <div class="slide-wrapper"><img src="carousels/03-live-prep/slide-01.png" alt="Slide 1"><div class="slide-label">Slide 1</div></div>
            <div class="slide-wrapper"><img src="carousels/03-live-prep/slide-02.png" alt="Slide 2"><div class="slide-label">Slide 2</div></div>
            <div class="slide-wrapper"><img src="carousels/03-live-prep/slide-03.png" alt="Slide 3"><div class="slide-label">Slide 3</div></div>
            <div class="slide-wrapper"><img src="carousels/03-live-prep/slide-04.png" alt="Slide 4"><div class="slide-label">Slide 4</div></div>
            <div class="slide-wrapper"><img src="carousels/03-live-prep/slide-05.png" alt="Slide 5"><div class="slide-label">Slide 5</div></div>
        </div>
    </div>

    <div class="carousel-group">
        <h2>04 &mdash; Bundle All Tools</h2>
        <div class="slides">
            <div class="slide-wrapper"><img src="carousels/04-bundle-all-tools/slide-01.png" alt="Slide 1"><div class="slide-label">Slide 1</div></div>
            <div class="slide-wrapper"><img src="carousels/04-bundle-all-tools/slide-02.png" alt="Slide 2"><div class="slide-label">Slide 2</div></div>
            <div class="slide-wrapper"><img src="carousels/04-bundle-all-tools/slide-03.png" alt="Slide 3"><div class="slide-label">Slide 3</div></div>
            <div class="slide-wrapper"><img src="carousels/04-bundle-all-tools/slide-04.png" alt="Slide 4"><div class="slide-label">Slide 4</div></div>
            <div class="slide-wrapper"><img src="carousels/04-bundle-all-tools/slide-05.png" alt="Slide 5"><div class="slide-label">Slide 5</div></div>
        </div>
    </div>
</body>
</html>
