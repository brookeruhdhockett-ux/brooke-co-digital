<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&amp;family=Outfit:wght@300;500&amp;display=swap');
    </style>
  </defs>
  <rect width="1200" height="630" fill="#faf6f1"/>
  <!-- Decorative circles -->
  <circle cx="1050" cy="80" r="200" fill="#f2ddd5" opacity="0.4"/>
  <circle cx="150" cy="550" r="160" fill="#b5c4b1" opacity="0.2"/>
  <!-- Main text -->
  <text x="600" y="220" font-family="DM Serif Display, serif" font-size="72" fill="#3a3632" text-anchor="middle">brooke co. digital</text>
  <text x="600" y="290" font-family="Outfit, sans-serif" font-weight="300" font-size="28" fill="#7d756c" text-anchor="middle">beautiful websites + social media for small businesses</text>
  <!-- Divider -->
  <rect x="576" y="320" width="48" height="3" rx="1.5" fill="#b5c4b1"/>
  <!-- Three mini preview cards -->
  <!-- Construction -->
  <rect x="200" y="370" width="220" height="140" rx="12" fill="#3d4147"/>
  <rect x="200" y="470" width="220" height="40" rx="0 0 12 12" fill="#e8e4df"/>
  <text x="310" y="440" font-family="DM Serif Display, serif" font-size="16" fill="#ffffff" text-anchor="middle">Prairie Built</text>
  <text x="310" y="460" font-family="Outfit, sans-serif" font-weight="300" font-size="12" fill="#c9a96e" text-anchor="middle">construction</text>
  <text x="310" y="496" font-family="Outfit, sans-serif" font-weight="300" font-size="11" fill="#7d756c" text-anchor="middle">web design + seo</text>
  <!-- Salon -->
  <rect x="490" y="370" width="220" height="140" rx="12" fill="#e8cfc6"/>
  <rect x="490" y="470" width="220" height="40" rx="0 0 12 12" fill="#e8e4df"/>
  <text x="600" y="440" font-family="DM Serif Display, serif" font-size="16" fill="#3a3632" text-anchor="middle">Ember &amp; Sage</text>
  <text x="600" y="460" font-family="Outfit, sans-serif" font-weight="300" font-size="12" fill="#8a9f85" text-anchor="middle">salon</text>
  <text x="600" y="496" font-family="Outfit, sans-serif" font-weight="300" font-size="11" fill="#7d756c" text-anchor="middle">web design + branding</text>
  <!-- Restaurant -->
  <rect x="780" y="370" width="220" height="140" rx="12" fill="#3a3836"/>
  <rect x="780" y="470" width="220" height="40" rx="0 0 12 12" fill="#e8e4df"/>
  <text x="890" y="440" font-family="DM Serif Display, serif" font-size="16" fill="#ffffff" text-anchor="middle">Iron &amp; Grain</text>
  <text x="890" y="460" font-family="Outfit, sans-serif" font-weight="300" font-size="12" fill="#c0623a" text-anchor="middle">restaurant</text>
  <text x="890" y="496" font-family="Outfit, sans-serif" font-weight="300" font-size="11" fill="#7d756c" text-anchor="middle">web design + menus</text>
  <!-- Bottom text -->
  <text x="600" y="580" font-family="Outfit, sans-serif" font-weight="300" font-size="16" fill="#b5c4b1" text-anchor="middle">south dakota — brookecohome</text>
